name: Action Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  composite-action:
    name: Composite Action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test action result rendering
        run: python3 action/test_render_result.py

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-action-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-action-cargo-

      - name: Compatible local comparison succeeds
        id: compatible
        uses: ./action
        with:
          old-wasm: fixtures/phase2/compatible-function-added/old.wasm
          new-wasm: fixtures/phase2/compatible-function-added/new.wasm

      - name: Check compatible result
        run: |
          test "${{ steps.compatible.outputs.result }}" = "compatible"
          test "${{ steps.compatible.outputs.breaking-count }}" = "0"
          test "${{ steps.compatible.outputs.unknown-count }}" = "0"

      - name: Breaking local comparison fails
        id: breaking
        continue-on-error: true
        uses: ./action
        with:
          old-wasm: fixtures/phase2/breaking-return-type-changed/old.wasm
          new-wasm: fixtures/phase2/breaking-return-type-changed/new.wasm

      - name: Check breaking outcome
        run: |
          test "${{ steps.breaking.outcome }}" = "failure"
          test "${{ steps.breaking.outputs.result }}" = "breaking"
          test "${{ steps.breaking.outputs.breaking-count }}" = "1"

      - name: Compatible comparison passes with strictest fail-on
        id: fail-on-warning
        uses: ./action
        with:
          old-wasm: fixtures/phase2/compatible-function-added/old.wasm
          new-wasm: fixtures/phase2/compatible-function-added/new.wasm
          fail-on: warning

      - name: Breaking comparison still fails with loosest fail-on
        id: fail-on-breaking
        continue-on-error: true
        uses: ./action
        with:
          old-wasm: fixtures/phase2/breaking-return-type-changed/old.wasm
          new-wasm: fixtures/phase2/breaking-return-type-changed/new.wasm
          fail-on: breaking

      - name: Invalid fail-on value fails
        id: fail-on-invalid
        continue-on-error: true
        uses: ./action
        with:
          old-wasm: fixtures/phase2/compatible-function-added/old.wasm
          new-wasm: fixtures/phase2/compatible-function-added/new.wasm
          fail-on: compatible

      - name: Check fail-on outcomes
        run: |
          test "${{ steps.fail-on-warning.outcome }}" = "success"
          test "${{ steps.fail-on-breaking.outcome }}" = "failure"
          test "${{ steps.fail-on-invalid.outcome }}" = "failure"
