[workspace]
members = [
    "crates/guard-core",
    "crates/guard-cli",
    "crates/guard-rpc",
]
exclude = [
    "fixtures/basic-contract",
    "fixtures/phase2/compatible-function-added/old",
    "fixtures/phase2/compatible-function-added/new",
    "fixtures/phase2/breaking-function-removed/old",
    "fixtures/phase2/breaking-function-removed/new",
    "fixtures/phase2/breaking-argument-type-changed/old",
    "fixtures/phase2/breaking-argument-type-changed/new",
    "fixtures/phase2/breaking-return-type-changed/old",
    "fixtures/phase2/breaking-return-type-changed/new",
    "fixtures/phase2/struct-field-changed/old",
    "fixtures/phase2/struct-field-changed/new",
    "fixtures/phase3/live-breaking-candidate",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Dayz-tech-co/stellar-upgrade-guard"

[workspace.dependencies]
clap = { version = "4.5.48", features = ["derive"] }
guard-core = { path = "crates/guard-core" }
guard-rpc = { path = "crates/guard-rpc" }
async-trait = "0.1.89"
hex = "0.4.3"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
soroban-spec = "28.0.0"
stellar-strkey = "0.0.18"
stellar-xdr = { version = "28.0.0", features = ["base64"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
